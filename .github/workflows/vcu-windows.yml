name: VCU Windows build

on:
  push:
    paths: ['vcu/**', '.github/workflows/vcu-windows.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vcu
    env:
      VCU_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Build exe (one file)
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name WS22_VCU
          --add-data "dbc;dbc" --add-data "config.json;." --add-data "config_bench24v.json;."
          --collect-submodules can --hidden-import can.interfaces.pcan vcu_app.py

      - name: Self-test packaged exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\WS22_VCU.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
          $docs = [Environment]::GetFolderPath('MyDocuments')
          Get-ChildItem -Recurse "$docs\WS22_VCU"
          if (-not (Test-Path "$docs\WS22_VCU\logs\selftest_ok.txt")) { throw 'selftest marker missing' }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: WS22_VCU_Setup_${{ env.VCU_VERSION }}
          path: |
            vcu/dist/WS22_VCU_Setup.exe
            vcu/dist/WS22_VCU.exe
          if-no-files-found: error
