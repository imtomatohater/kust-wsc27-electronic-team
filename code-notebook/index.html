<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코드 정리 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --canvas: #e7ebf1;
    --canvas-line: #d3dae3;
    --surface: #ffffff;
    --surface-border: #d8dce3;
    --text: #22262e;
    --text-dim: #66708a;
    --text-faint: #9aa2b5;
    --accent: #2f4fa8;
    --accent-strong: #1c3577;
    --accent-soft: #e7ecfb;
    --shadow: rgba(23, 35, 64, 0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --canvas: #12151b;
      --canvas-line: #1d2530;
      --surface: #1b1f27;
      --surface-border: #2b303c;
      --text: #e6e9ef;
      --text-dim: #aab0bc;
      --text-faint: #707786;
      --accent: #7c9af0;
      --accent-strong: #aec3f5;
      --accent-soft: #202a44;
      --shadow: rgba(0, 0, 0, 0.55);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --canvas: #12151b;
    --canvas-line: #1d2530;
    --surface: #1b1f27;
    --surface-border: #2b303c;
    --text: #e6e9ef;
    --text-dim: #aab0bc;
    --text-faint: #707786;
    --accent: #7c9af0;
    --accent-strong: #aec3f5;
    --accent-soft: #202a44;
    --shadow: rgba(0, 0, 0, 0.55);
  }

  /* the notebook sheet always mimics real A4 paper, independent of app theme */
  :root {
    --paper: #fffdf8;
    --paper-line: #ded6c2;
    --paper-ink: #2a2721;
    --paper-num: #a4977d;
    --paper-divider: #cfc6ac;
    --paper-tab: #948968;
  }

  * { box-sizing: border-box; }
  html, body { background: var(--canvas); }
  body {
    margin: 0;
    padding: 0 16px;
    font-family: "Public Sans", -apple-system, "Malgun Gothic", sans-serif;
    color: var(--text);
    background-image: radial-gradient(var(--canvas-line) 1px, transparent 1px);
    background-size: 22px 22px;
  }

  header.masthead {
    max-width: 960px;
    margin: 0 auto;
    padding: 36px 4px 18px;
  }
  header.masthead .eyebrow {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 8px;
  }
  header.masthead h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(26px, 4vw, 34px);
    margin: 0 0 6px;
    text-wrap: balance;
  }
  header.masthead p {
    margin: 0;
    color: var(--text-dim);
    font-size: 14.5px;
    max-width: 60ch;
    line-height: 1.6;
  }

  .controls {
    max-width: 960px;
    margin: 0 auto 8px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    padding: 22px 24px 20px;
    border-radius: 14px;
    box-shadow: 0 10px 30px -18px var(--shadow);
  }
  .controls label {
    display: block;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .controls textarea {
    width: 100%;
    min-height: 240px;
    font-family: "JetBrains Mono", "D2Coding", monospace;
    font-size: 13px;
    line-height: 1.6;
    tab-size: 4;
    padding: 14px;
    border: 1px solid var(--surface-border);
    border-radius: 10px;
    resize: vertical;
    background: var(--canvas);
    color: var(--text);
  }
  .controls textarea:focus, .controls input:focus, .controls select:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .controls input[type="text"], .controls select, .controls input[type="number"] {
    padding: 8px 10px;
    border: 1px solid var(--surface-border);
    border-radius: 8px;
    font-size: 13.5px;
    font-family: "Public Sans", sans-serif;
    background: var(--surface);
    color: var(--text);
  }
  .field-row {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    margin-top: 16px;
    align-items: flex-end;
  }
  .field { display: flex; flex-direction: column; min-width: 120px; }
  .btn-row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  button {
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid var(--surface-border);
    background: var(--surface);
    color: var(--text);
    font-family: "Public Sans", sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  button:not(.primary):hover { background: var(--accent-soft); }
  .hint {
    font-size: 12.5px;
    color: var(--text-faint);
    margin-top: 14px;
    line-height: 1.7;
    border-top: 1px solid var(--surface-border);
    padding-top: 12px;
  }
  .status {
    font-size: 12.5px;
    color: var(--accent-strong);
    margin-top: 10px;
    min-height: 16px;
    font-weight: 500;
  }

  #pages {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    padding: 32px 0 90px;
  }

  .page {
    width: 210mm;
    height: 297mm;
    max-width: 100%;
    background: var(--paper);
    box-shadow: 0 18px 40px -18px var(--shadow), 0 2px 6px rgba(0,0,0,.06);
    padding: 14mm 12mm 10mm;
    display: flex;
    flex-direction: column;
    position: relative;
    color: var(--paper-ink);
  }
  .page .filetab {
    font-family: "JetBrains Mono", monospace;
    font-size: 9pt;
    color: var(--paper-tab);
    padding-bottom: 6px;
    border-bottom: 1px solid var(--paper-line);
    margin-bottom: 2px;
  }
  .page .content {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .code-col {
    flex: 0 0 68%;
    border-right: 1px solid var(--paper-divider);
    padding-right: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .note-col {
    flex: 1;
    padding-left: 16px;
    display: flex;
    flex-direction: column;
  }
  .code-row {
    display: flex;
    align-items: baseline;
    white-space: nowrap;
  }
  .code-row .ln {
    flex: 0 0 32px;
    color: var(--paper-num);
    text-align: right;
    padding-right: 10px;
    font-family: "JetBrains Mono", monospace;
    font-variant-numeric: tabular-nums;
    user-select: none;
  }
  .code-row .code {
    white-space: pre;
    overflow: hidden;
    font-family: "JetBrains Mono", "D2Coding", monospace;
  }
  .note-row { border-bottom: 1px solid var(--paper-line); }
  .page .pageno {
    position: absolute;
    right: 12mm;
    bottom: 5mm;
    font-size: 8pt;
    color: var(--paper-num);
    font-family: "JetBrains Mono", monospace;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 480px) {
    header.masthead, .controls { padding-left: 4px; padding-right: 4px; }
    .field-row { gap: 12px; }
  }

  @media print {
    body { background: #fff; padding: 0; }
    header.masthead, .controls { display: none; }
    #pages { padding: 0; gap: 0; }
    .page { box-shadow: none; }
    .page { break-after: page; }
    .page:last-child { break-after: auto; }
  }
  @page { size: A4; margin: 0; }
</style>
</head>
<body>

<header class="masthead">
  <p class="eyebrow">Printable · A4 · 10pt</p>
  <h1>코드 정리 노트</h1>
  <p>코드를 붙여넣으면 줄 번호와 들여쓰기를 그대로 살려 A4 필사 노트에 옮겨 적고, 오른쪽 줄에는 손글씨 메모 공간을 남겨 둡니다.</p>
</header>

<div class="controls">
  <label for="code">코드 입력</label>
  <textarea id="code" placeholder="여기에 코드를 붙여넣으세요...">#include &lt;stdio.h&gt;

int main(void)
{
    int sum = 0;
    for (int i = 1; i <= 10; i++)
    {
        sum += i;
    }
    printf("%d\n", sum);
    return 0;
}</textarea>

  <div class="field-row">
    <div class="field">
      <label for="filename">파일 이름 (상단 표시)</label>
      <input type="text" id="filename" value="main.c">
    </div>
    <div class="field">
      <label for="tabsize">탭(들여쓰기) 크기</label>
      <select id="tabsize">
        <option value="2">2칸</option>
        <option value="4" selected>4칸</option>
        <option value="8">8칸</option>
      </select>
    </div>
    <div class="field">
      <label for="fontsize">글자 크기 (pt)</label>
      <input type="number" id="fontsize" value="10" min="6" max="14" step="0.5" style="width:70px">
    </div>
  </div>

  <div class="btn-row">
    <button class="primary" id="renderBtn">노트 생성</button>
    <button id="printBtn">PDF로 저장 (인쇄)</button>
  </div>
  <div class="status" id="status"></div>
  <div class="hint">
    · 들여쓰기(탭/스페이스)는 입력한 그대로 유지되어 노트에 그려집니다.<br>
    · 한 줄이 너무 길면 코드 칸에 맞도록 글자 크기가 자동으로 줄어듭니다.<br>
    · "PDF로 저장"을 누르면 인쇄 대화상자가 열립니다. 대상(프린터)을 "PDF로 저장"으로 선택하세요.
  </div>
</div>

<div id="pages"></div>

<script>
(function () {
  const codeEl = document.getElementById('code');
  const filenameEl = document.getElementById('filename');
  const tabsizeEl = document.getElementById('tabsize');
  const fontsizeEl = document.getElementById('fontsize');
  const statusEl = document.getElementById('status');
  const pagesEl = document.getElementById('pages');

  const MIN_FONT_PT = 6;
  const FONT_STEP = 0.5;
  const LINE_HEIGHT_RATIO = 1.65;

  function expandTabs(line, tabSize) {
    let result = '';
    let col = 0;
    for (const ch of line) {
      if (ch === '\t') {
        const spaces = tabSize - (col % tabSize);
        result += ' '.repeat(spaces);
        col += spaces;
      } else {
        result += ch;
        col += 1;
      }
    }
    return result;
  }

  function buildPageSkeleton(filename) {
    const page = document.createElement('div');
    page.className = 'page';

    const tab = document.createElement('div');
    tab.className = 'filetab';
    tab.textContent = filename || 'untitled';
    page.appendChild(tab);

    const content = document.createElement('div');
    content.className = 'content';

    const codeCol = document.createElement('div');
    codeCol.className = 'code-col';
    const noteCol = document.createElement('div');
    noteCol.className = 'note-col';

    content.appendChild(codeCol);
    content.appendChild(noteCol);
    page.appendChild(content);

    return { page, codeCol, noteCol, content };
  }

  function makeCodeRow(lineNo, text, fontPt) {
    const row = document.createElement('div');
    row.className = 'code-row';
    row.style.fontSize = fontPt + 'pt';
    row.style.lineHeight = (fontPt * LINE_HEIGHT_RATIO) + 'pt';

    const ln = document.createElement('span');
    ln.className = 'ln';
    ln.textContent = lineNo;

    const code = document.createElement('span');
    code.className = 'code';
    code.textContent = text;

    row.appendChild(ln);
    row.appendChild(code);
    return row;
  }

  function makeNoteRow(fontPt) {
    const row = document.createElement('div');
    row.className = 'note-row';
    row.style.height = (fontPt * LINE_HEIGHT_RATIO) + 'pt';
    return row;
  }

  function measureLinesPerPage(fontPt, filename) {
    const probe = document.createElement('div');
    probe.style.position = 'absolute';
    probe.style.left = '-9999px';
    probe.style.top = '0';
    document.body.appendChild(probe);

    const { page, codeCol, noteCol } = buildPageSkeleton(filename);
    probe.appendChild(page);

    let count = 0;
    const maxTry = 400;
    while (count < maxTry) {
      const row = makeCodeRow(String(count + 1), 'sample', fontPt);
      codeCol.appendChild(row);
      noteCol.appendChild(makeNoteRow(fontPt));
      count++;
      if (codeCol.scrollHeight > codeCol.clientHeight + 1) {
        codeCol.removeChild(codeCol.lastChild);
        noteCol.removeChild(noteCol.lastChild);
        count--;
        break;
      }
    }
    document.body.removeChild(probe);
    return Math.max(count, 1);
  }

  function checkHorizontalOverflow(pageEls) {
    for (const page of pageEls) {
      const codeSpans = page.querySelectorAll('.code-row .code');
      for (const span of codeSpans) {
        if (span.scrollWidth > span.clientWidth + 1) return true;
      }
    }
    return false;
  }

  function renderAll() {
    statusEl.textContent = '';
    pagesEl.innerHTML = '';

    const rawLines = codeEl.value.replace(/\r\n/g, '\n').split('\n');
    const tabSize = parseInt(tabsizeEl.value, 10);
    const expandedLines = rawLines.map(l => expandTabs(l, tabSize));
    const filename = filenameEl.value.trim() || 'untitled';

    let fontPt = parseFloat(fontsizeEl.value) || 10;
    let attempts = 0;
    let finalPages = [];
    let autoShrunk = false;

    while (attempts < 20) {
      attempts++;
      const linesPerPage = measureLinesPerPage(fontPt, filename);

      const chunks = [];
      for (let i = 0; i < expandedLines.length; i += linesPerPage) {
        chunks.push(expandedLines.slice(i, i + linesPerPage));
      }
      if (chunks.length === 0) chunks.push(['']);

      const builtPages = [];
      chunks.forEach((chunk, pageIdx) => {
        const { page, codeCol, noteCol } = buildPageSkeleton(filename);
        chunk.forEach((text, i) => {
          const lineNo = pageIdx * linesPerPage + i + 1;
          codeCol.appendChild(makeCodeRow(String(lineNo), text, fontPt));
          noteCol.appendChild(makeNoteRow(fontPt));
        });
        const pageNoTag = document.createElement('div');
        pageNoTag.className = 'pageno';
        pageNoTag.textContent = (pageIdx + 1) + ' / ' + chunks.length;
        page.appendChild(pageNoTag);
        builtPages.push(page);
      });

      builtPages.forEach(p => pagesEl.appendChild(p));

      const overflow = checkHorizontalOverflow(builtPages);
      if (!overflow || fontPt <= MIN_FONT_PT) {
        finalPages = builtPages;
        if (overflow && fontPt <= MIN_FONT_PT) {
          statusEl.textContent = '일부 줄이 너무 길어 ' + MIN_FONT_PT + 'pt에서도 칸을 넘어갑니다. 코드를 줄여서 입력해 주세요.';
        } else if (autoShrunk) {
          statusEl.textContent = '긴 줄이 있어 글자 크기를 ' + fontPt + 'pt로 자동 조정했습니다.';
        }
        break;
      }

      pagesEl.innerHTML = '';
      fontPt = Math.max(MIN_FONT_PT, fontPt - FONT_STEP);
      autoShrunk = true;
    }
  }

  document.getElementById('renderBtn').addEventListener('click', renderAll);
  document.getElementById('printBtn').addEventListener('click', function () {
    if (!pagesEl.children.length) renderAll();
    window.print();
  });

  renderAll();
})();
</script>
</body>
</html>
